[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "astra-licensing-automation"
version = "0.1.0"
description = "Astra Licensing Automation - production backend foundation (Milestone 1)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<2",
    "uvicorn[standard]>=0.32,<1",
    "httpx>=0.28,<1",
    "msal>=1.31,<2",
    "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<2",
    "pytest-cov>=6,<8",
    "httpx>=0.28,<1",
    "respx>=0.22,<1",
    "ruff>=0.8",
    "mypy>=1.13,<2",
    "asgi-lifespan>=2.1,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["prototype-data", "attachments", ".venv"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "SIM",      # flake8-simplify
    "C4",       # flake8-comprehensions
    "RUF",      # ruff-specific
]
ignore = [
    "B008",  # FastAPI uses function calls (Depends) in argument defaults by design
]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
warn_return_any = true
show_error_codes = true
exclude = ["prototype-data", "attachments", "\\.venv"]

[[tool.mypy.overrides]]
module = ["asyncpg.*", "msal.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "error::RuntimeWarning",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/__main__.py"]
# SQLAlchemy's async bridge runs ORM work inside greenlets; without this,
# code executing downstream of greenlet_spawn is invisible to coverage.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
