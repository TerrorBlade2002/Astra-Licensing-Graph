name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: astra
          POSTGRES_PASSWORD: astra_ci
          POSTGRES_DB: astra_licensing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U astra -d astra_licensing_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://astra:astra_ci@localhost:5432/astra_licensing_test
      DATABASE_URL: postgresql+asyncpg://astra:astra_ci@localhost:5432/astra_licensing_test
      # No Microsoft or OpenAI credentials exist in CI; all Graph tests are
      # respx-mocked and any real network call to Graph would fail the run.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt
          pip install -e . --no-deps

      - name: Scan for obvious committed secrets
        run: |
          ! grep -rInE \
            '(client_secret|CLIENT_SECRET)[[:space:]]*[=:][[:space:]]*["'"'"'][A-Za-z0-9~._-]{16,}|eyJ[A-Za-z0-9_-]{40,}\.eyJ|-----BEGIN (RSA |EC )?PRIVATE KEY-----' \
            --include='*.py' --include='*.toml' --include='*.yml' --include='*.yaml' \
            --include='*.ini' --include='*.md' --include='*.ps1' --include='*.example' \
            app tests docs scripts migrations .env.example pyproject.toml \
            || (echo 'Potential secret pattern found in committed files' && exit 1)

      - name: Ruff format check
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      - name: mypy
        run: mypy app

      - name: Alembic migration check (upgrade / downgrade / upgrade)
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Block live Microsoft Graph traffic
        # Belt-and-braces: resolve graph.microsoft.com and login.microsoftonline.com
        # to a blackhole so any unmocked call fails fast instead of leaving CI.
        run: |
          echo "127.0.0.2 graph.microsoft.com" | sudo tee -a /etc/hosts
          echo "127.0.0.2 login.microsoftonline.com" | sudo tee -a /etc/hosts
          echo "127.0.0.2 api.openai.com" | sudo tee -a /etc/hosts

      - name: Tests with coverage (unit, integration, mocked Graph)
        run: pytest --cov=app --cov-report=term --cov-fail-under=85

      - name: Verify no live Graph hostname was contacted
        run: |
          # The blackhole entries above guarantee it; this step documents the
          # invariant explicitly for reviewers.
          echo "Microsoft Graph, Entra login, and OpenAI API hosts were blackholed for the entire test run."

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install, typecheck, tests, and build
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run build

      - name: Verify no provider secret in frontend assets
        run: |
          ! grep -rInE '(OPENAI_API_KEY|sk-[A-Za-z0-9_-]{16,})' frontend/dist

      - name: Playwright portal workflow
        env:
          APP_ENV: test
          AUTH_MODE: development
        run: |
          python -m app.cli.seed_milestone4 --reset
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > backend-e2e.log 2>&1 &
          BACKEND_PID=$!
          (cd frontend && npm run dev -- --host 127.0.0.1 > ../frontend-e2e.log 2>&1) &
          FRONTEND_PID=$!
          trap 'kill "$BACKEND_PID" "$FRONTEND_PID" 2>/dev/null || true' EXIT
          for URL in http://127.0.0.1:8000/health http://127.0.0.1:5173; do
            for ATTEMPT in {1..30}; do
              curl --fail --silent "$URL" > /dev/null && break
              sleep 1
            done
            curl --fail --silent "$URL" > /dev/null
          done
          cd frontend
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Verify no upload-session URL leaked to artifacts
        if: always()
        run: |
          ! grep -rInE 'https://[^ ]+(upload|createUploadSession)' \
            backend-e2e.log frontend-e2e.log frontend/test-results frontend/playwright-report \
            2>/dev/null
